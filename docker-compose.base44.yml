services:
  firestore:
    image: eclipse-temurin:21-jre
    restart: on-failure
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
      - firestore-emulator-cache:/emulator
    command:
      - bash
      - -ec
      - |
        if [ ! -s /emulator/firestore-1.19.8.jar ]; then
          curl --fail --location --retry 3 https://storage.googleapis.com/firebase-preview-drop/emulator/cloud-firestore-emulator-v1.19.8.jar -o /emulator/firestore-1.19.8.jar.tmp
          mv /emulator/firestore-1.19.8.jar.tmp /emulator/firestore-1.19.8.jar
        fi
        exec java -Xmx512m -jar /emulator/firestore-1.19.8.jar --host=0.0.0.0 --port=8080 --project_id=fir-firestore-sample-ios --rules=/workspace/Example/FirestoreSample/firestore.rules --import-data=/workspace/Example/FirestoreSample/data/firestore_export/firestore_export.overall_export_metadata
    healthcheck:
      test: [CMD-SHELL, 'curl --fail --silent --max-time 4 "http://localhost:8080/v1/projects/fir-firestore-sample-ios/databases/(default)/documents/fruits" >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
  web:
    image: node:22
    restart: on-failure
    working_dir: /workspace/Example/FirestoreWeb
    volumes:
      - .:/workspace
      - firestore-web-modules:/workspace/Example/FirestoreWeb/node_modules
    ports:
      - '3000:3000'
    environment:
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:
    command: [sh, -ec, 'npm ci --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 3000']
    depends_on:
      firestore:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, 'Promise.all([fetch("http://localhost:3000/").then(r=>{if(!r.ok)throw Error("frontend failed")}),fetch("http://localhost:3000/firestore/v1/projects/fir-firestore-sample-ios/databases/(default)/documents/fruits").then(r=>{if(!r.ok)throw Error("Firestore proxy failed")})]).catch(e=>{console.error(e.message);process.exit(1)})']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
volumes:
  firestore-emulator-cache:
  firestore-web-modules:
